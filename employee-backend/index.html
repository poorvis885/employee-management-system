<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Operations Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        const rawRole = (localStorage.getItem('userRole') || 'EMPLOYEE').trim().toUpperCase();
        const isAdmin = (rawRole === 'ADMIN');

        if (!isAdmin) {
            document.documentElement.classList.add('user-mode');
        }
    </script>

    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --input-bg: #ffffff;
            --table-header: #f8fafc;
        }

        /* 1. 🌙 Dark Mode Variables */
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --table-header: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 24px; transition: background-color 0.3s, color 0.3s; }
        .app-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        canvas { display: block !important; width: 100% !important; max-height: 250px !important; }

        html.user-mode .admin-only { display: none !important; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border); }
        .user-badge { background: var(--bg); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); color: var(--text); }
        .role-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-left: 6px; }
        .role-admin { background: #fef3c7; color: #92400e; }
        .role-employee { background: #e0f2fe; color: #075985; }

        .theme-toggle-btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .stat-card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-card p { font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; }
        .stat-card h3 { font-size: 26px; font-weight: 700; margin-top: 8px; }

        .toolbar { display: flex; flex-direction: column; gap: 14px; background: var(--surface); padding: 16px 24px; border-radius: 12px; border: 1px solid var(--border); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .search-filter { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }

        input, select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text); }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .num-input { width: 130px; }

        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-export { background: #059669; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-reset { background: var(--border); color: var(--text); border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }

        .table-container { background: var(--surface); border-radius: 12px 12px 0 0; border: 1px solid var(--border); border-bottom: none; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--table-header); padding: 14px 20px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; font-size: 14px; border-bottom: 1px solid var(--border); }

        .dept-tag { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #e0e7ff; color: #3730a3; }
        .emp-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--border); color: var(--text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; margin-right: 10px; }

        /* 2. 🔗 Clickable Employee Link Style */
        .emp-link { text-decoration: none; color: var(--text); font-weight: 700; transition: color 0.2s; }
        .emp-link:hover { color: var(--primary); text-decoration: underline; }

        .btn-edit { background: transparent; color: var(--primary); border: 1px solid #c7d2fe; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        /* 3. 📄 Pagination Bar Style */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 12px 20px; border-radius: 0 0 12px 12px; border: 1px solid var(--border); font-size: 14px; }

        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(15, 23, 42, 0.4); display: none; align-items: center; justify-content: center; }
        .modal { background: var(--surface); padding: 28px; border-radius: 16px; width: 100%; max-width: 500px; }
        .modal-form { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="app-container">

    <div class="header">
        <h1>Employee Operations Center</h1>
        <div style="display:flex; align-items:center; gap:12px;">
            <span id="userInfo" class="user-badge">👤 Loading...</span>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
            <button class="btn-secondary" onclick="logout()">🔒 Logout</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <p>Total Headcount</p>
            <h3 id="statTotal">0</h3>
        </div>
        <div class="stat-card" id="statPayrollCard">
            <p>Total Monthly Payroll</p>
            <h3 id="statPayroll">₹0</h3>
        </div>
        <div class="stat-card">
            <p>Active Departments</p>
            <h3 id="statDepts">0</h3>
        </div>
    </div>

    <div class="stats-grid" style="margin-top: 10px;">
        <div class="stat-card">
            <p style="margin-bottom: 12px;">Headcount by Department</p>
            <canvas id="headcountChart"></canvas>
        </div>
        <div class="stat-card">
            <p style="margin-bottom: 12px;">Department Salary Budget (₹)</p>
            <canvas id="salaryChart"></canvas>
        </div>
    </div>

    <div class="toolbar">
        <div class="filter-row">
            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="Search name, code, designation..." oninput="filterData()" autocomplete="off" style="min-width: 220px;">
                <select id="deptFilter" onchange="filterData()">
                    <option value="">All Departments</option>
                </select>
                <input type="number" id="minSalary" placeholder="Min Salary ₹" oninput="filterData()" class="num-input">
                <input type="number" id="maxSalary" placeholder="Max Salary ₹" oninput="filterData()" class="num-input">
                <select id="sortFilter" onchange="filterData()" style="min-width: 170px;">
                    <option value="name-asc">Sort: Name (A-Z)</option>
                    <option value="name-desc">Sort: Name (Z-A)</option>
                    <option value="salary-desc">Sort: Salary (High to Low)</option>
                    <option value="salary-asc">Sort: Salary (Low to High)</option>
                    <option value="code-asc">Sort: Code</option>
                </select>
                <button class="btn-reset" onclick="resetFilters()">🔄 Reset</button>
            </div>
            <div class="action-btns" style="display:flex; gap:10px;">
                <button id="exportBtn" class="btn-export admin-only" onclick="exportToCSV()">📥 Export CSV</button>
                <button id="addBtn" class="btn-primary admin-only" onclick="openModal(false)">+ Add Employee</button>
            </div>
        </div>
    </div>

    <div>
        <div class="table-container">
            <table>
                <thead>
                <tr id="tableHeaderRow">
                    <th class="sortable" onclick="sortByHeader('name')">Employee <span id="sort-name">↕</span></th>
                    <th class="sortable" onclick="sortByHeader('code')">Code <span id="sort-code">↕</span></th>
                    <th>Email</th>
                    <th class="sortable" onclick="sortByHeader('department')">Department <span id="sort-department">↕</span></th>
                    <th class="sortable" onclick="sortByHeader('designation')">Designation <span id="sort-designation">↕</span></th>
                    <th class="sortable" onclick="sortByHeader('salary')">Salary <span id="sort-salary">↕</span></th>
                    <th id="actionHeader" class="admin-only">Actions</th>
                </tr>
                </thead>
                <tbody id="empTable"></tbody>
            </table>
        </div>

        <!-- 3. 📄 Pagination Bar Component -->
        <div class="pagination-bar">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span>Rows per page:</span>
                <select id="pageSizeSelect" onchange="changePageSize()" style="padding: 4px 8px;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                </select>
                <span id="pageRangeInfo" style="color: var(--muted); margin-left: 10px;">Showing 0-0 of 0</span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button id="prevPageBtn" class="btn-secondary" onclick="changePage(-1)">❮ Prev</button>
                <span id="currentPageBadge" style="font-weight: 600; padding: 4px 10px; background: #e0e7ff; color: #3730a3; border-radius: 6px;">Page 1</span>
                <button id="nextPageBtn" class="btn-secondary" onclick="changePage(1)">Next ❯</button>
            </div>
        </div>
    </div>

</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h3 id="modalTitle">Add New Employee</h3>
        <form class="modal-form" id="empForm">
            <input type="hidden" id="empId">
            <input type="text" id="code" placeholder="Employee Code" autocomplete="off" required>
            <input type="text" id="name" placeholder="Full Name" autocomplete="name" required>
            <input type="email" id="email" placeholder="Email Address" autocomplete="email" required>
            <input type="text" id="department" placeholder="Department" autocomplete="off" required>
            <input type="text" id="designation" placeholder="Designation" autocomplete="off" required>
            <input type="number" id="salary" placeholder="Salary (₹)" autocomplete="off" required>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary" id="submitBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const username = localStorage.getItem('username') || 'User';
    const API_URL = 'http://localhost:5000/api/employees';
    let allEmployees = [];

    let currentPage = 1;
    let pageSize = 10;
    let currentFilteredData = [];

    let headcountChartInstance = null;
    let salaryChartInstance = null;
    let currentSortState = { field: 'name', dir: 'asc' };

    document.addEventListener('DOMContentLoaded', () => {
        const userInfo = document.getElementById('userInfo');
        const roleClass = isAdmin ? 'role-admin' : 'role-employee';
        userInfo.innerHTML = `👤 <b>${username}</b> <span class="role-tag ${roleClass}">${isAdmin ? 'ADMIN' : 'EMPLOYEE'}</span>`;

        const savedTheme = localStorage.getItem('appTheme') || 'light';
        applyTheme(savedTheme);

        loadEmployees();
    });

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('appTheme', theme);
        const themeBtn = document.getElementById('themeBtn');
        if (themeBtn) {
            themeBtn.innerHTML = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function loadEmployees() {
        try {
            const res = await fetch(API_URL);
            allEmployees = await res.json();

            populateDeptDropdown();
            filterData();
        } catch (err) {
            showToast('Error connecting to server');
        }
    }

    function renderStats(data) {
        document.getElementById('statTotal').innerText = data.length;
        const totalSalary = data.reduce((acc, curr) => acc + Number(curr.salary || 0), 0);
        document.getElementById('statPayroll').innerText = '₹' + totalSalary.toLocaleString('en-IN');
        const depts = new Set(data.map(e => e.department));
        document.getElementById('statDepts').innerText = depts.size;
    }

    function populateDeptDropdown() {
        const select = document.getElementById('deptFilter');
        const currentSelection = select.value;
        const depts = [...new Set(allEmployees.map(e => e.department))].sort();
        select.innerHTML = '<option value="">All Departments</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        select.value = currentSelection;
    }

    function filterData() {
        const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase();
        const selectedDept = document.getElementById('deptFilter').value;
        const minSal = Number(document.getElementById('minSalary').value) || 0;
        const maxSal = Number(document.getElementById('maxSalary').value) || Infinity;
        const sortVal = document.getElementById('sortFilter').value;

        let filtered = allEmployees.filter(emp => {
            const matchSearch = (emp.name || '').toLowerCase().includes(searchTerm) ||
                (emp.code || '').toLowerCase().includes(searchTerm) ||
                (emp.designation || '').toLowerCase().includes(searchTerm) ||
                (emp.email || '').toLowerCase().includes(searchTerm);

            const matchDept = selectedDept === '' || emp.department === selectedDept;
            const sal = Number(emp.salary) || 0;
            const matchSalary = sal >= minSal && sal <= maxSal;

            return matchSearch && matchDept && matchSalary;
        });

        const [field, dir] = sortVal.split('-');
        currentSortState = { field, dir };
        updateSortIcons(field, dir);

        filtered.sort((a, b) => {
            let valA = a[field] ?? '';
            let valB = b[field] ?? '';

            if (field === 'salary') {
                valA = Number(valA) || 0;
                valB = Number(valB) || 0;
            } else {
                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();
            }

            if (valA < valB) return dir === 'asc' ? -1 : 1;
            if (valA > valB) return dir === 'asc' ? 1 : -1;
            return 0;
        });

        currentFilteredData = filtered;
        currentPage = 1;

        renderStats(filtered);
        renderCharts(filtered);
        updatePaginatedTable();
    }

    function updatePaginatedTable() {
        const totalRecords = currentFilteredData.length;
        const totalPages = Math.ceil(totalRecords / pageSize) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, totalRecords);
        const paginatedSlice = currentFilteredData.slice(startIndex, endIndex);

        renderTable(paginatedSlice);

        document.getElementById('pageRangeInfo').innerText = totalRecords > 0
            ? `Showing ${startIndex + 1}-${endIndex} of ${totalRecords}`
            : 'Showing 0-0 of 0';

        document.getElementById('currentPageBadge').innerText = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevPageBtn').disabled = (currentPage === 1);
        document.getElementById('nextPageBtn').disabled = (currentPage === totalPages || totalPages === 0);
    }

    function changePage(delta) {
        currentPage += delta;
        updatePaginatedTable();
    }

    function changePageSize() {
        pageSize = Number(document.getElementById('pageSizeSelect').value);
        currentPage = 1;
        updatePaginatedTable();
    }

    function sortByHeader(field) {
        let dir = 'asc';
        if (currentSortState.field === field && currentSortState.dir === 'asc') {
            dir = 'desc';
        }
        document.getElementById('sortFilter').value = `${field}-${dir}`;
        filterData();
    }

    function updateSortIcons(activeField, dir) {
        ['name', 'code', 'department', 'designation', 'salary'].forEach(field => {
            const el = document.getElementById(`sort-${field}`);
            if (el) {
                if (field === activeField) {
                    el.innerText = dir === 'asc' ? '▲' : '▼';
                } else {
                    el.innerText = '↕';
                }
            }
        });
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('deptFilter').value = '';
        document.getElementById('minSalary').value = '';
        document.getElementById('maxSalary').value = '';
        document.getElementById('sortFilter').value = 'name-asc';
        filterData();
    }

    function renderCharts(data) {
        if (!data) return;

        const deptData = {};
        data.forEach(emp => {
            const dept = emp.department || 'Unassigned';
            const salary = Number(emp.salary) || 0;

            if (!deptData[dept]) {
                deptData[dept] = { count: 0, totalSalary: 0 };
            }
            deptData[dept].count += 1;
            deptData[dept].totalSalary += salary;
        });

        const labels = Object.keys(deptData);
        const headcountValues = labels.map(d => deptData[d].count);
        const salaryValues = labels.map(d => deptData[d].totalSalary);

        if (headcountChartInstance) headcountChartInstance.destroy();
        if (salaryChartInstance) salaryChartInstance.destroy();

        const colors = ['#4f46e5', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b', '#ef4444'];

        const ctx1 = document.getElementById('headcountChart').getContext('2d');
        headcountChartInstance = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{ data: headcountValues, backgroundColor: colors, borderWidth: 1 }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });

        const ctx2 = document.getElementById('salaryChart').getContext('2d');
        salaryChartInstance = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Salary Expense (₹)',
                    data: salaryValues,
                    backgroundColor: '#4f46e5',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { callback: (val) => '₹' + val.toLocaleString('en-IN') } } }
            }
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('empTable');

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${isAdmin ? 7 : 6}" style="text-align:center; padding:30px;">No matching records found.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(emp => {
            const initials = emp.name ? emp.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'EM';

            const actionTD = `
                <td class="admin-only">
                    <button class="btn-edit" onclick="editEmp('${emp._id}')">Edit</button>
                    <button class="btn-danger" onclick="deleteEmp('${emp._id}')">Delete</button>
                </td>
            `;

            return `
                <tr>
                    <td>
                        <div style="display:flex; align-items:center;">
                            <div class="emp-avatar">${initials}</div>
                            <a href="profile.html?id=${emp._id}" class="emp-link" title="Click to view full profile">
                                ${emp.name} 🔗
                            </a>
                        </div>
                    </td>
                    <td><code>${emp.code}</code></td>
                    <td style="color:var(--muted);">${emp.email}</td>
                    <td><span class="dept-tag">${emp.department}</span></td>
                    <td>${emp.designation}</td>
                    <td><strong>₹${Number(emp.salary).toLocaleString('en-IN')}</strong></td>
                    ${actionTD}
                </tr>
            `;
        }).join('');
    }

    function openModal(isEdit = false) {
        if (!isAdmin) return;
        if (!isEdit) {
            document.getElementById('empForm').reset();
            document.getElementById('empId').value = '';
            document.getElementById('modalTitle').innerText = 'Add New Employee';
        }
        document.getElementById('addModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('addModal').style.display = 'none';
    }

    function editEmp(id) {
        if (!isAdmin) return;
        const emp = allEmployees.find(e => e._id === id);
        if (!emp) return;
        document.getElementById('empId').value = emp._id;
        document.getElementById('code').value = emp.code;
        document.getElementById('name').value = emp.name;
        document.getElementById('email').value = emp.email;
        document.getElementById('department').value = emp.department;
        document.getElementById('designation').value = emp.designation;
        document.getElementById('salary').value = emp.salary;
        document.getElementById('modalTitle').innerText = 'Edit Employee';
        openModal(true);
    }

    document.getElementById('empForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isAdmin) return;

        const id = document.getElementById('empId').value;
        const empData = {
            code: document.getElementById('code').value,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            department: document.getElementById('department').value,
            designation: document.getElementById('designation').value,
            salary: Number(document.getElementById('salary').value)
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(empData)
        });

        if (res.ok) {
            closeModal();
            loadEmployees();
            showToast(id ? 'Updated!' : 'Added!');
        }
    });

    async function deleteEmp(id) {
        if (!isAdmin) return;
        if (!confirm('Delete this record?')) return;
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (res.ok) {
            loadEmployees();
            showToast('Deleted!');
        }
    }

    function exportToCSV() {
        if (!isAdmin) return;
        const headers = ['Code', 'Name', 'Email', 'Department', 'Designation', 'Salary'];
        const rows = allEmployees.map(e => [`"${e.code}"`, `"${e.name}"`, `"${e.email}"`, `"${e.department}"`, `"${e.designation}"`, e.salary]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', 'Employees.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
