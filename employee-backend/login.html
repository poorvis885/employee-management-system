<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Operations Center</title>
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .login-card h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; font-weight: 700; text-align: center; }
        .login-card p { color: #64748b; font-size: 14px; margin-bottom: 24px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 13px; font-weight: 600; color: var(--text); }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-hover); }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; text-align: center; }
        .hint-box { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 12px; color: #64748b; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Welcome Back 👋</h2>
    <p>Sign in to access Employee Operations Center</p>

    <div class="error-msg" id="errorMsg">Invalid credentials!</div>

    <form id="loginForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn-submit">Login to Dashboard</button>
    </form>

    <div class="hint-box">
        <strong>🔑 Credentials:</strong><br>
        • <b>Admin:</b> <code>admin</code> / <code>admin123</code> (Full Control)<br>
        • <b>User:</b> <code>user</code> / <code>user123</code> (Read Only)
    </div>
</div>

<script>
    // Clear old session when visiting login page
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('userRole');
    localStorage.removeItem('username');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        // 1. Direct Local Evaluation (Fail-Safe)
        if (usernameInput === 'admin' && passwordInput === 'admin123') {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', 'Admin User');
            localStorage.setItem('userRole', 'ADMIN');
            window.location.href = 'index.html';
            return;
        }

        if (usernameInput === 'user' && passwordInput === 'user123') {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', 'Employee');
            localStorage.setItem('userRole', 'EMPLOYEE');
            window.location.href = 'index.html';
            return;
        }

        // 2. Server API Attempt
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', data.user ? data.user.username : usernameInput);
                localStorage.setItem('userRole', data.user ? data.user.role : 'EMPLOYEE');
                window.location.href = 'index.html';
            } else {
                errorMsg.innerText = data.message || 'Invalid Username or Password!';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = 'Invalid Username or Password!';
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
