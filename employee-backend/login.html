<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Operations Center</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

        .login-card { background: var(--surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .login-card h2 { font-size: 22px; color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-main); }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background: var(--primary-hover); }

        .error-msg { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; text-align: center; }
        .hint-box { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 12px; color: var(--text-muted); margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Welcome Back 👋</h2>
    <p>Sign in to access Employee Operations Center</p>

    <div class="error-msg" id="errorMsg">Invalid credentials!</div>

    <form id="loginForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn-submit">Login to Dashboard</button>
    </form>

    <div class="hint-box">
        <strong>Default Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
</div>

<script>
    // If already logged in, redirect straight to dashboard
    if (localStorage.getItem('isLoggedIn') === 'true') {
        window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const res = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                // Store Session
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', usernameInput);

                // Redirect to Dashboard
                window.location.href = 'index.html';
            } else {
                errorMsg.innerText = data.message || 'Invalid Username or Password!';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = 'Unable to connect to server. Ensure node server.js is running.';
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
