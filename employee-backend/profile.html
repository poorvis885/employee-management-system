<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 24px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 600px; margin: 40px auto; background: var(--surface); padding: 32px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .field-group { display: grid; grid-template-columns: 140px 1fr; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .label { font-weight: 600; color: var(--muted); }
        .value { font-weight: 500; }
        .btn-back { display: inline-block; margin-top: 24px; padding: 10px 18px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .badge { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="avatar" id="empInitials">--</div>
        <div>
            <h2 id="empName">Loading...</h2>
            <p id="empDesignation" style="color: var(--muted);">Please wait</p>
        </div>
    </div>

    <div id="profileDetails">
        <div class="field-group"><span class="label">Employee Code:</span><span class="value"><code id="empCode">...</code></span></div>
        <div class="field-group"><span class="label">Email:</span><span class="value" id="empEmail">...</span></div>
        <div class="field-group"><span class="label">Department:</span><span class="value"><span class="badge" id="empDept">...</span></span></div>
        <div class="field-group"><span class="label">Monthly Salary:</span><span class="value" id="empSalary">...</span></div>
    </div>

    <a href="index.html" class="btn-back">⬅ Back to Dashboard</a>
</div>

<script>
    // Theme setup from localStorage
    const savedTheme = localStorage.getItem('appTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // Dynamic API URL for both local and Render production
    const API_URL = '/api/employees';

    async function loadProfile() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (!id) {
            document.getElementById('empName').innerText = 'Employee Not Found';
            return;
        }

        try {
            const res = await fetch(`${API_URL}/${id}`);
            if (!res.ok) throw new Error('Failed to fetch profile data');

            const emp = await res.json();

            document.getElementById('empName').innerText = emp.name || 'N/A';
            document.getElementById('empDesignation').innerText = emp.designation || 'N/A';
            document.getElementById('empCode').innerText = emp.code || 'N/A';
            document.getElementById('empEmail').innerText = emp.email || 'N/A';
            document.getElementById('empDept').innerText = emp.department || 'N/A';
            document.getElementById('empSalary').innerText = '₹' + Number(emp.salary || 0).toLocaleString('en-IN');

            const initials = emp.name ? emp.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'EM';
            document.getElementById('empInitials').innerText = initials;

        } catch (err) {
            console.error(err);
            document.getElementById('empName').innerText = 'Error Loading Profile';
            document.getElementById('empDesignation').innerText = 'Could not retrieve data from server';
        }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
